<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YATZY - Turing Machine Edition</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        
        <!-- CABECERA Y CONTROL DE TURNOS -->
        <header class="game-header">
            <h1>YATZY</h1>
            <div class="turn-indicator">
                <span>Turno actual: <strong id="current-turn">Jugador 1</strong></span>
                <span>Tiros restantes: <strong id="rolls-left">3</strong></span>
            </div>
        </header>

        <main class="game-layout">
            
            <!-- SECCIÓN IZQUIERDA: DADOS Y CONTROLES -->
            <section class="controls-section">
                <!-- Cajones estáticos para los 5 dados -->
                <div class="dice-container">
                    <button class="die" data-index="0" id="die-0">?</button>
                    <button class="die" data-index="1" id="die-1">?</button>
                    <button class="die" data-index="2" id="die-2">?</button>
                    <button class="die" data-index="3" id="die-3">?</button>
                    <button class="die" data-index="4" id="die-4">?</button>
                </div>

                <div class="action-buttons">
                    <button id="btn-roll" class="btn primary">Lanzar Dados</button>
                </div>
            </section>

            <!-- SECCIÓN DERECHA: PLANILLA DE PUNTUACIÓN (YAZY BOARD) -->
            <section class="scorecard-section">
                <table class="scorecard-table">
                    <thead>
                        <tr>
                            <th class="table-columns">Combinación</th>
                            <th class="table-columns">J1</th>
                            <th class="table-columns">J2/Bot</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Sección Superior (Números) -->
                        <tr data-category="ones">
                            <td class="category-name"><i class="fa-solid fa-dice-one"></i></td>
                            <td><button class="score p1-score" id="score-ones-p1">-</button></td>
                            <td><button class="score p2-score" id="score-ones-p2">-</button></td>
                        </tr>
                        <tr data-category="twos">
                            <td class="category-name"><i class="fa-solid fa-dice-two"></i></td>
                            <td><button class="score p1-score" id="score-twos-p1">-</button></td>
                            <td><button class="score p2-score" id="score-twos-p2">-</button></td>
                        </tr>
                        <tr data-category="threes">
                            <td class="category-name"><i class="fa-solid fa-dice-three"></i></td>
                            <td><button class="score p1-score" id="score-threes-p1">-</button></td>
                            <td><button class="score p2-score" id="score-threes-p2">-</button></td>
                        </tr>
                        <tr data-category="fours">
                            <td class="category-name"><i class="fa-solid fa-dice-four"></i></td>
                            <td><button class="score p1-score" id="score-fours-p1">-</button></td>
                            <td><button class="score p2-score" id="score-fours-p2">-</button></td>
                        </tr>
                        <tr data-category="fives">
                            <td class="category-name"><i class="fa-solid fa-dice-five"></i></td>
                            <td><button class="score p1-score" id="score-fives-p1">-</button></td>
                            <td><button class="score p2-score" id="score-fives-p2">-</button></td>
                        </tr>
                        <tr data-category="sixes">
                            <td class="category-name"><i class="fa-solid fa-dice-six"></i></td>
                            <td><button class="score p1-score" id="score-sixes-p1">-</button></td>
                            <td><button class="score p2-score" id="score-sixes-p2">-</button></td>
                        </tr>

                        <!-- Sección Inferior (Combinaciones Especiales) -->
                        <tr data-category="trio">
                            <td class="category-name">
                                <i class="fa-solid fa-play fa-rotate-270"></i>
                                <i class="fa-solid fa-play fa-rotate-270"></i>
                                <i class="fa-solid fa-play fa-rotate-270"></i>
                            </td>
                            <td><button class="score p1-score" id="score-trio-p1">-</button></td>
                            <td><button class="score p2-score" id="score-trio-p2">-</button></td>
                        </tr>
                        <tr data-category="poker">
                            <td class="category-name">
                                <i class="fa-solid fa-square"></i>
                                <i class="fa-solid fa-square"></i>
                                <i class="fa-solid fa-square"></i>
                                <i class="fa-solid fa-square"></i>
                            </td>
                            <td><button class="score p1-score" id="score-poker-p1">-</button></td>
                            <td><button class="score p2-score" id="score-poker-p2">-</button></td>
                        </tr>
                        <tr data-category="full_house">
                            <td class="category-name">
                                <i class="fa-solid fa-circle"></i>
                                <i class="fa-solid fa-circle"></i>
                                <i class="fa-solid fa-play fa-rotate-270"></i>
                                <i class="fa-solid fa-play fa-rotate-270"></i>
                                <i class="fa-solid fa-play fa-rotate-270"></i>
                            </td>
                            <td><button class="score p1-score" id="score-full_house-p1">-</button></td>
                            <td><button class="score p2-score" id="score-full_house-p2">-</button></td>
                        </tr>
                        <tr data-category="straight">
                            <td class="category-name">
                                <i class="fa-solid fa-circle"></i>
                                <i class="fa-solid fa-play fa-rotate-270"></i>
                                <i class="fa-solid fa-square"></i>
                                <i class="fa-solid fa-diamond"></i>
                                <i class="fa-solid fa-star"></i>
                            </td>
                            <td><button class="score p1-score" id="score-straight-p1">-</button></td>
                            <td><button class="score p2-score" id="score-straight-p2">-</button></td>
                        </tr>
                        <tr data-category="yazy">
                            <td class="category-name">
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                            </td>
                            <td><button class="score p1-score" id="score-yazy-p1">-</button></td>
                            <td><button class="score p2-score" id="score-yazy-p2">-</button></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr class="puntaje-row">
                            <td>Puntaje</td>
                            <td id="total-p1">0</td>
                            <td id="total-p2">0</td>
                        </tr>
                    </tfoot>
                </table>
            </section>

            <div class="action-buttons">
                <button id="btn-reset" class="btn secondary">Reiniciar Juego</button>
            </div>

        </main>
    </div>

    <!-- Script principal como módulo ES6 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
